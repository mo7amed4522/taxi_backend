name: Issue Labeler

on:
  issues:
    types: [opened]

jobs:
  label:
    name: Label Issues
    runs-on: ubuntu-latest
    steps:
      - name: Label based on issue body
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const title = context.payload.issue.title || '';
            const labels = [];

            // Detect bug reports
            if (/bug|issue|error|crash|fail/i.test(title) || /reproduce|steps|expected|actual/i.test(body)) {
              labels.push('bug');
            }

            // Detect feature requests
            if (/feature|request|suggestion|enhancement|want/i.test(title) || /new feature|could you/i.test(body)) {
              labels.push('enhancement');
            }

            // Detect documentation requests
            if (/doc|readme|documentation|guide/i.test(title) || /update docs/i.test(body)) {
              labels.push('documentation');
            }

            // Detect environment-related
            if (/env|configuration|setup|docker/i.test(body.toLowerCase())) {
              labels.push('question');
            }

            if (labels.length > 0) {
              github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: labels
              });
            }
