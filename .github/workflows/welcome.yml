name: Welcome New Contributors

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  welcome:
    name: Welcome Contributors
    runs-on: ubuntu-latest
    steps:
      - name: Welcome first-time contributors
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Welcome to **Taxi Backend**!

            Thank you for opening your first issue. We'll review it as soon as possible.

            In the meantime, please check our [Contributing Guide](./.github/CONTRIBUTING.md) for helpful tips.
          pr-message: |
            🎉 Welcome to **Taxi Backend**!

            Thank you for your first pull request! Our team will review it shortly.

            Please make sure all CI checks pass and your changes follow our [contributing guidelines](./.github/CONTRIBUTING.md).
