name: Auto Assign PR

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  assign:
    name: Auto Assign PR
    runs-on: ubuntu-latest
    steps:
      - name: Assign PR to creator
        uses: technote-space/assign-pr-action@v2
        with:
          ASSIGNEE: ${{ github.event.pull_request.user.login }}

      - name: Add reviewers based on label
        if: github.event.pull_request.labels.length > 0
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const reviewers = [];
            if (labels.includes('backend')) reviewers.push('backend-team');
            if (labels.includes('api')) reviewers.push('api-team');
            if (reviewers.length > 0) {
              github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                reviewers: reviewers
              });
            }
