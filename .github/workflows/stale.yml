name: Stale Issues & PRs

on:
  schedule:
    - cron: '0 2 * * *'

jobs:
  stale:
    name: Clean Stale Issues & PRs
    runs-on: ubuntu-latest
    steps:
      - name: Mark stale issues and PRs
        uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed if no further activity occurs.
          stale-pr-message: |
            This PR has been automatically marked as stale because it has not had
            recent activity. It will be closed if no further activity occurs.
          close-issue-message: |
            This issue has been closed due to inactivity. Please reopen if this
            is still relevant.
          close-pr-message: |
            This PR has been closed due to inactivity. Please reopen if you'd
            like to continue working on it.
          exempt-issue-labels: 'pinned,high-priority'
          exempt-pr-labels: 'pinned,high-priority'
          operations-per-run: 100
